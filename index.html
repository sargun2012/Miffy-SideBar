<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miffy Local Hub</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:#55545a;
    overflow-x:hidden;
    transition:background 1.8s ease;
}

/* =========================================================
   VERY LIGHT TIME-OF-DAY THEMES
   ========================================================= */

body.morning{
    background:
        radial-gradient(circle at 20% 10%,#ffffff 0,#f8f8f8 35%,transparent 65%),
        linear-gradient(145deg,#f4f4f4,#eeeeee,#fafafa);
}

body.day{
    background:
        radial-gradient(circle at 50% 0%,#ffffff 0,#f7f7f7 45%,transparent 75%),
        linear-gradient(145deg,#f1f1f1,#fafafa,#ededed);
}

body.sunset{
    background:
        radial-gradient(circle at 75% 15%,#fdfdfd 0,#f4f4f4 35%,transparent 70%),
        linear-gradient(145deg,#eeeeee,#f7f7f7,#e9e9e9);
}

body.night{
    background:
        radial-gradient(circle at 80% 5%,#ffffff 0,#f3f3f3 30%,transparent 70%),
        linear-gradient(145deg,#e9e9e9,#f5f5f5,#e7e7e7);
}

.page{
    width:100%;
    max-width:650px;
    margin:0 auto;
    padding:22px 14px 45px;
}

/* =========================================================
   HEADINGS
   ========================================================= */

.main-heading{
    text-align:center;
    font-size:clamp(2rem,8vw,3.2rem);
    line-height:1;
    font-weight:900;
    white-space:nowrap;
    margin:8px 0 24px;
    color:#55545a;
}

.section-heading{
    text-align:center;
    font-size:clamp(1.7rem,6vw,2.35rem);
    line-height:1.05;
    font-weight:900;
    white-space:nowrap;
    margin:0 0 20px;
    color:#5b5960;
}

/* =========================================================
   GENERAL CARDS
   ========================================================= */

.data-card{
    background:rgba(255,255,255,.78);
    border:1px solid #dedee1;
    border-radius:24px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 12px 32px rgba(90,90,95,.09);
    transition:
        background 1.8s ease,
        border-color 1.8s ease,
        box-shadow 1.8s ease;
}

/* =========================================================
   MEMBER COUNT
   ========================================================= */

.member-count{
    text-align:center;
    font-size:clamp(1.8rem,7vw,2.7rem);
    font-weight:900;
    color:#8b888e;
    white-space:nowrap;
    margin:8px 0 20px;
}

.member-subtitle{
    text-align:center;
    color:#aaa8ad;
    font-size:.76rem;
    letter-spacing:1.5px;
    font-weight:800;
}

/* =========================================================
   NEW MEMBERS
   ========================================================= */

.members-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.member-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 15px;
    border-radius:15px;
    background:#f7f7f7;
    border:1px solid #e3e3e5;
}

.member-number{
    width:32px;
    height:32px;
    flex:none;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#e7e7e9;
    color:#77757b;
    font-weight:900;
}

.member-name{
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#5f5d63;
    font-weight:750;
}

/* =========================================================
   LOCAL TIME CARD
   ========================================================= */

.local-card{
    position:relative;
    overflow:hidden;
    border-radius:28px;
    padding:22px 18px 24px;
    background:rgba(255,255,255,.84);
    border:1px solid #dcdcdf;
    box-shadow:
        0 16px 42px rgba(80,80,85,.11),
        inset 0 1px rgba(255,255,255,.9);
    transition:
        background 1.8s ease,
        border-color 1.8s ease,
        box-shadow 1.8s ease;
}

.local-card::before{
    content:"";
    position:absolute;
    width:190px;
    height:190px;
    border-radius:50%;
    top:-125px;
    right:-65px;
    background:rgba(255,255,255,.85);
    filter:blur(12px);
    pointer-events:none;
    transition:background 1.8s ease;
}

.local-title{
    position:relative;
    z-index:1;
    text-align:center;
    font-size:clamp(1.8rem,6vw,2.45rem);
    line-height:1;
    font-weight:900;
    letter-spacing:1px;
    white-space:nowrap;
    margin:0 0 20px;
    color:#59575d;
}

/* =========================================================
   CALENDAR
   ========================================================= */

.calendar{
    position:relative;
    z-index:1;
    width:100%;
    padding:16px;
    border-radius:21px;
    background:rgba(250,250,250,.92);
    border:1px solid #dedee1;
    transition:
        background 1.8s ease,
        border-color 1.8s ease;
}

.calendar-header{
    display:grid;
    grid-template-columns:42px minmax(0,1fr) 42px;
    align-items:center;
    gap:8px;
    width:100%;
    margin-bottom:17px;
}

.calendar-header button{
    width:42px;
    height:42px;
    padding:0;
    border:1px solid #dedee1;
    border-radius:50%;
    background:#ffffff;
    color:#68666c;
    font-size:1.6rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:
        background .25s ease,
        transform .15s ease,
        border-color .25s ease;
}

.calendar-header button:hover{
    background:#f1f1f1;
}

.calendar-header button:active{
    transform:scale(.93);
}

.calendar-month{
    text-align:center;
    font-size:clamp(1.05rem,4.5vw,1.35rem);
    font-weight:900;
    line-height:1.1;
    white-space:nowrap;
    color:#5d5b61;
}

/* Perfect seven-column alignment */

.weekdays,
.calendar-days{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    width:100%;
    gap:5px;
}

.weekdays{
    margin-bottom:7px;
}

.weekdays span{
    min-width:0;
    text-align:center;
    color:#aaa8ad;
    font-size:.68rem;
    line-height:30px;
    font-weight:900;
    white-space:nowrap;
}

.calendar-days span{
    width:100%;
    aspect-ratio:1 / 1;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    color:#77757b;
    font-size:.82rem;
    font-weight:750;
    line-height:1;
}

.calendar-days span.empty{
    visibility:hidden;
}

/* Today */

.calendar-days span.today{
    background:#d9d9db;
    color:#444248;
    font-weight:950;
    box-shadow:
        0 0 0 2px rgba(120,120,125,.12),
        0 5px 15px rgba(100,100,105,.12);
}

/* =========================================================
   LIVE TIME
   ========================================================= */

.local-time{
    position:relative;
    z-index:1;
    text-align:center;
    margin-top:23px;
    font-size:clamp(2rem,9vw,3rem);
    line-height:1;
    font-weight:950;
    letter-spacing:1px;
    color:#66646a;
    white-space:nowrap;
}

.local-date{
    position:relative;
    z-index:1;
    text-align:center;
    margin-top:9px;
    color:#99979d;
    font-size:.9rem;
    font-weight:650;
    white-space:nowrap;
}

/* =========================================================
   COUNTRY / AREA
   ========================================================= */

.location-info{
    position:relative;
    z-index:1;
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid #e0e0e2;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.location-row{
    display:grid;
    grid-template-columns:36px minmax(0,1fr);
    align-items:center;
    gap:10px;
    min-height:52px;
}

.location-icon{
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:#eeeeef;
    font-size:1.1rem;
}

.location-text{
    min-width:0;
}

.location-text small{
    display:block;
    color:#aaa8ad;
    font-size:.61rem;
    letter-spacing:1.3px;
    line-height:1.1;
    font-weight:900;
    white-space:nowrap;
}

.location-text strong{
    display:block;
    margin-top:4px;
    color:#66646a;
    font-size:.84rem;
    line-height:1.2;
    font-weight:750;
    overflow-wrap:anywhere;
}

.status{
    position:relative;
    z-index:1;
    text-align:center;
    margin-top:16px;
    color:#aaa8ad;
    font-size:.65rem;
    letter-spacing:1.2px;
    font-weight:850;
    white-space:nowrap;
}

/* =========================================================
   SUBTLE TIME-OF-DAY CHANGES
   All remain GREY + WHITE.
   ========================================================= */

/* Morning: brightest */

.morning .local-card{
    background:rgba(255,255,255,.92);
    border-color:#e4e4e4;
    box-shadow:0 16px 42px rgba(180,180,180,.12);
}

.morning .calendar{
    background:#ffffff;
}

/* Day: clean white */

.day .local-card{
    background:rgba(255,255,255,.88);
    border-color:#dcdcdf;
}

.day .calendar{
    background:#fafafa;
}

/* Sunset: slightly warmer-looking neutral grey */

.sunset .local-card{
    background:rgba(249,249,249,.90);
    border-color:#d9d9db;
    box-shadow:0 16px 42px rgba(145,145,145,.13);
}

.sunset .calendar{
    background:#f7f7f7;
}

/* Night: slightly cooler grey, still very light */

.night .local-card{
    background:rgba(242,242,243,.94);
    border-color:#d4d4d7;
    box-shadow:0 16px 42px rgba(90,90,95,.15);
}

.night .calendar{
    background:#eeeeef;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:430px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .data-card{
        padding:17px;
        border-radius:21px;
    }

    .local-card{
        padding:18px 12px 20px;
        border-radius:23px;
    }

    .calendar{
        padding:12px 8px;
    }

    .weekdays,
    .calendar-days{
        gap:3px;
    }

    .weekdays span{
        font-size:.59rem;
    }

    .calendar-days span{
        font-size:.74rem;
        border-radius:9px;
    }

    .calendar-header{
        grid-template-columns:38px minmax(0,1fr) 38px;
    }

    .calendar-header button{
        width:38px;
        height:38px;
    }

    .local-date{
        font-size:.78rem;
    }
}

@media(max-width:350px){

    .weekdays span{
        font-size:.54rem;
    }

    .calendar-days span{
        font-size:.68rem;
    }

    .calendar{
        padding-left:5px;
        padding-right:5px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="main-heading">
        🤍 Miffy Local Hub 🤍
    </div>

    <!-- MEMBER COUNT -->

    <div class="data-card">

        <div class="section-heading">
            ✨ Miffy Members ✨
        </div>

        <div
            class="member-count"
            id="memberCount">
            Loading...
        </div>

        <div class="member-subtitle">
            LIVE CLUB DATA
        </div>

    </div>

    <!-- NEWEST MEMBERS -->

    <div class="data-card">

        <div class="section-heading">
            🌱 Newest Members 🌱
        </div>

        <div
            class="members-list"
            id="membersList">

            <div class="member-row">
                <div class="member-number">1</div>
                <div class="member-name">Loading...</div>
            </div>

            <div class="member-row">
                <div class="member-number">2</div>
                <div class="member-name">Loading...</div>
            </div>

            <div class="member-row">
                <div class="member-number">3</div>
                <div class="member-name">Loading...</div>
            </div>

        </div>

    </div>

    <!-- LOCAL TIME -->

    <div class="local-card">

        <div class="local-title">
            🌙 LOCAL TIME 🌙
        </div>

        <div class="calendar">

            <div class="calendar-header">

                <button
                    type="button"
                    id="prevMonth"
                    aria-label="Previous month">
                    ‹
                </button>

                <div
                    class="calendar-month"
                    id="calendarMonth">
                    Loading...
                </div>

                <button
                    type="button"
                    id="nextMonth"
                    aria-label="Next month">
                    ›
                </button>

            </div>

            <div class="weekdays">
                <span>Sun</span>
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
            </div>

            <div
                class="calendar-days"
                id="calendarDays">
            </div>

        </div>

        <div
            class="local-time"
            id="localTime">
            --:--:--
        </div>

        <div
            class="local-date"
            id="localDate">
            Loading date...
        </div>

        <div class="location-info">

            <div class="location-row">

                <div class="location-icon">
                    🌍
                </div>

                <div class="location-text">

                    <small>COUNTRY</small>

                    <strong id="localCountry">
                        Detecting...
                    </strong>

                </div>

            </div>

            <div class="location-row">

                <div class="location-icon">
                    📍
                </div>

                <div class="location-text">

                    <small>AREA / TIMEZONE</small>

                    <strong id="localArea">
                        Detecting...
                    </strong>

                </div>

            </div>

        </div>

        <div
            class="status"
            id="timeStatus">
            LOCAL TIME • UPDATING LIVE
        </div>

    </div>

</div>

<script>
const MIFFY_CLUB = "miffy-1";

/* =========================================================
   JSONP
   ========================================================= */

function jsonp(url){

    return new Promise(function(resolve,reject){

        const callbackName =
            "miffyCallback_" +
            Date.now() +
            "_" +
            Math.floor(Math.random()*10000);

        const script =
            document.createElement("script");

        const separator =
            url.includes("?") ? "&" : "?";

        const timeout =
            setTimeout(function(){

                cleanup();

                reject(
                    new Error("Request timed out")
                );

            },15000);

        function cleanup(){

            clearTimeout(timeout);

            if(script.parentNode){
                script.parentNode.removeChild(script);
            }

            try{
                delete window[callbackName];
            }catch(e){
                window[callbackName] = undefined;
            }
        }

        window[callbackName] =
            function(data){

                cleanup();
                resolve(data);

            };

        script.onerror =
            function(){

                cleanup();

                reject(
                    new Error("API request failed")
                );

            };

        script.src =
            url +
            separator +
            "callback=" +
            encodeURIComponent(callbackName);

        document.head.appendChild(script);
    });
}

/* =========================================================
   MEMBER COUNT
   ========================================================= */

async function updateMemberCount(){

    const element =
        document.getElementById("memberCount");

    try{

        const data =
            await jsonp(
                "https://api.chess.com/pub/club/" +
                MIFFY_CLUB
            );

        const count =
            Number(
                data &&
                data.members_count
            );

        if(Number.isFinite(count)){

            element.textContent =
                "✨ " +
                count.toLocaleString() +
                " Members ✨";

        }else{

            element.textContent =
                "✨ Miffy Club ✨";
        }

    }catch(error){

        console.log(
            "Member count unavailable:",
            error
        );

        element.textContent =
            "✨ Miffy Club ✨";
    }
}

/* =========================================================
   NEWEST MEMBERS
   ========================================================= */

async function updateNewestMembers(){

    const list =
        document.getElementById("membersList");

    try{

        const data =
            await jsonp(
                "https://api.chess.com/pub/club/" +
                MIFFY_CLUB +
                "/members"
            );

        let members =
            data &&
            Array.isArray(data.all_time)
                ? data.all_time
                : [];

        members.sort(
            function(a,b){
                return Number(b.joined || 0) -
                       Number(a.joined || 0);
            }
        );

        members =
            members.slice(0,3);

        list.innerHTML = "";

        for(let i=0;i<3;i++){

            const row =
                document.createElement("div");

            row.className =
                "member-row";

            const member =
                members[i];

            row.innerHTML =
                '<div class="member-number">' +
                (i+1) +
                '</div>' +
                '<div class="member-name">' +
                (
                    member
                        ? escapeHTML(
                            member.username ||
                            "Unknown member"
                          )
                        : "—"
                ) +
                '</div>';

            list.appendChild(row);
        }

    }catch(error){

        console.log(
            "Newest members unavailable:",
            error
        );

        list.innerHTML = "";

        for(let i=1;i<=3;i++){

            const row =
                document.createElement("div");

            row.className =
                "member-row";

            row.innerHTML =
                '<div class="member-number">' +
                i +
                '</div>' +
                '<div class="member-name">' +
                'Unable to load' +
                '</div>';

            list.appendChild(row);
        }
    }
}

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================================================
   CALENDAR
   ========================================================= */

const monthNames = [
    "January","February","March","April",
    "May","June","July","August",
    "September","October","November","December"
];

let calendarDate = new Date();

function renderCalendar(){

    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();

    document.getElementById(
        "calendarMonth"
    ).textContent =
        monthNames[month] +
        " " +
        year;

    const container =
        document.getElementById(
            "calendarDays"
        );

    container.innerHTML = "";

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();

    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();
