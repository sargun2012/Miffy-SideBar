<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miffy Local Hub</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #55545a;
  background: #f7f7f8;
  transition: background 1s ease;
}

body.morning {
  background: #fafafa;
}

body.day {
  background: #f6f7f7;
}

body.sunset {
  background: #f8f7f6;
}

body.night {
  background: #f3f3f5;
}

.page {
  width: min(920px, 94%);
  margin: 24px auto 50px;
}

.card {
  background: rgba(255,255,255,0.96);
  border: 2px solid #dedee1;
  border-radius: 30px;
  padding: 30px 24px;
  margin-bottom: 28px;
  box-shadow: 0 4px 18px rgba(80,80,90,0.05);
}

.main-heading {
  margin: 0 0 25px;
  text-align: center;
  font-size: clamp(30px, 6vw, 58px);
  line-height: 1.05;
  white-space: nowrap;
  color: #55545a;
  font-weight: 800;
}

.section-heading {
  margin: 0 0 25px;
  text-align: center;
  font-size: clamp(27px, 5vw, 48px);
  line-height: 1.05;
  white-space: nowrap;
  color: #66656b;
  font-weight: 800;
}

.member-count {
  text-align: center;
  font-size: clamp(48px, 10vw, 88px);
  line-height: 1;
  font-weight: 900;
  color: #8d8c92;
  margin: 12px 0;
}

.sub-title {
  text-align: center;
  font-size: clamp(18px, 3vw, 27px);
  font-weight: 800;
  letter-spacing: 2px;
  color: #aaa9ae;
}

.status {
  text-align: center;
  font-size: 15px;
  margin-top: 12px;
  color: #aaa9ae;
  min-height: 20px;
}

.members-list {
  display: grid;
  gap: 18px;
}

.member {
  display: flex;
  align-items: center;
  gap: 18px;
  background: #f8f8f9;
  border: 2px solid #dedee1;
  border-radius: 24px;
  padding: 20px 22px;
  min-height: 92px;
}

.member-number {
  flex: 0 0 54px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e9e9ec;
  color: #77767d;
  font-size: 25px;
  font-weight: 800;
}

.member-name {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: clamp(19px, 4vw, 29px);
  font-weight: 800;
  color: #5e5d64;
}

.member-date {
  margin-left: auto;
  white-space: nowrap;
  color: #aaa9ae;
  font-size: 14px;
}

.local-card {
  padding-bottom: 26px;
}

.calendar-wrap {
  border: 2px solid #dedee1;
  border-radius: 28px;
  padding: 18px;
  background: #fbfbfc;
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.month-button {
  width: 52px;
  height: 52px;
  border: 2px solid #dedee1;
  border-radius: 50%;
  background: white;
  color: #77767d;
  font-size: 30px;
  cursor: pointer;
}

.month-button:active {
  transform: scale(.95);
}

.calendar-month {
  flex: 1;
  text-align: center;
  font-size: clamp(21px, 4vw, 32px);
  font-weight: 800;
  color: #66656b;
  white-space: nowrap;
}

.weekdays,
.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}

.weekdays {
  margin-top: 24px;
}

.weekdays div {
  text-align: center;
  color: #aaa9ae;
  font-size: clamp(12px, 2.5vw, 17px);
  font-weight: 800;
  padding: 7px 0;
}

.calendar-days {
  row-gap: 8px;
  margin-top: 8px;
}

.calendar-day {
  min-width: 0;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #65646a;
  font-size: clamp(14px, 3vw, 18px);
  font-weight: 700;
}

.calendar-day.empty {
  visibility: hidden;
}

.calendar-day.today span {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #e3e3e6;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #55545a;
  font-weight: 900;
}

.local-time {
  text-align: center;
  margin-top: 28px;
  font-size: clamp(38px, 9vw, 70px);
  font-weight: 900;
  color: #5c5b62;
  line-height: 1;
}

.local-date {
  text-align: center;
  margin-top: 12px;
  font-size: clamp(17px, 3vw, 25px);
  font-weight: 700;
  color: #88878d;
}

.location-info {
  margin-top: 22px;
  display: grid;
  gap: 10px;
}

.location-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
  color: #77767d;
  font-size: clamp(14px, 2.8vw, 18px);
  font-weight: 700;
  text-align: center;
}

.location-icon {
  color: #9a999f;
}

.loading {
  color: #aaa9ae;
}

.error {
  color: #a5a4a9;
}

@media (max-width: 520px) {
  .page {
    width: 94%;
    margin-top: 12px;
  }

  .card {
    padding: 25px 15px;
    border-radius: 27px;
  }

  .member {
    padding: 17px 15px;
    gap: 13px;
  }

  .member-number {
    flex-basis: 48px;
    width: 48px;
    height: 48px;
    font-size: 21px;
  }

  .member-date {
    display: none;
  }

  .calendar-wrap {
    padding: 12px 8px;
  }

  .month-button {
    width: 46px;
    height: 46px;
    font-size: 27px;
  }

  .calendar-day {
    height: 42px;
  }

  .calendar-day.today span {
    width: 38px;
    height: 38px;
  }
}
</style>
</head>

<body>
<div class="page">

  <!-- MEMBER COUNT -->
  <section class="card">
    <h1 class="main-heading">✨ Miffy Members ✨</h1>

    <div id="memberCount" class="member-count loading">Loading...</div>

    <div class="sub-title">LIVE CLUB DATA</div>
    <div id="memberStatus" class="status">Connecting to Chess.com...</div>
  </section>


  <!-- NEWEST MEMBERS -->
  <section class="card">
    <h2 class="section-heading">🌱 Newest Members 🌱</h2>

    <div id="membersList" class="members-list">
      <div class="member">
        <div class="member-number">1</div>
        <div class="member-name loading">Loading...</div>
      </div>

      <div class="member">
        <div class="member-number">2</div>
        <div class="member-name loading">Loading...</div>
      </div>

      <div class="member">
        <div class="member-number">3</div>
        <div class="member-name loading">Loading...</div>
      </div>
    </div>
  </section>


  <!-- LOCAL TIME -->
  <section class="card local-card">
    <h2 class="section-heading">🌙 LOCAL TIME 🌙</h2>

    <div class="calendar-wrap">

      <div class="calendar-header">
        <button class="month-button" id="prevMonth" type="button" aria-label="Previous month">
          ‹
        </button>

        <div class="calendar-month" id="calendarMonth">
          Loading...
        </div>

        <button class="month-button" id="nextMonth" type="button" aria-label="Next month">
          ›
        </button>
      </div>

      <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>

      <div class="calendar-days" id="calendarDays"></div>

    </div>

    <div id="localTime" class="local-time">Loading...</div>
    <div id="localDate" class="local-date">Loading...</div>

    <div class="location-info">
      <div class="location-row">
        <span class="location-icon">🌍</span>
        <span id="country">Loading...</span>
      </div>

      <div class="location-row">
        <span class="location-icon">📍</span>
        <span id="area">Loading...</span>
      </div>

      <div class="location-row">
        <span class="location-icon">🕐</span>
        <span id="timezone">Loading...</span>
      </div>
    </div>
  </section>

</div>


<script>
"use strict";

/*
  Miffy Club
  Chess.com URL-ID:
*/
const MIFFY_CLUB = "miffy-1";

/*
  IMPORTANT:
  Chess.com PubAPI officially supports JSONP.
  We use one request at a time because Chess.com
  documents that parallel requests may trigger 429.
*/
function jsonp(url, timeout = 12000) {
  return new Promise((resolve, reject) => {
    const callbackName =
      "__miffyCallback_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");
    let finished = false;

    function cleanup() {
      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (_) {
        window[callbackName] = undefined;
      }
    }

    const timer = setTimeout(() => {
      if (finished) return;

      finished = true;
      cleanup();

      reject(new Error("Chess.com API timed out"));
    }, timeout);

    window[callbackName] = function(data) {
      if (finished) return;

      finished = true;
      clearTimeout(timer);
      cleanup();

      resolve(data);
    };

    script.onerror = function() {
      if (finished) return;

      finished = true;
      clearTimeout(timer);
      cleanup();

      reject(new Error("Chess.com API request failed"));
    };

    /*
      Cache-buster prevents the browser from keeping
      an old JSONP script response.
    */
    const separator = url.includes("?") ? "&" : "?";

    script.src =
      url +
      separator +
      "callback=" +
      encodeURIComponent(callbackName) +
      "&_=" +
      Date.now();

    document.head.appendChild(script);
  });
}


/* ---------------- MEMBER COUNT ---------------- */

async function updateMemberCount() {
  const countElement = document.getElementById("memberCount");
  const statusElement = document.getElementById("memberStatus");

  try {
    const data = await jsonp(
      "https://api.chess.com/pub/club/" + MIFFY_CLUB
    );

    if (
      data &&
      typeof data.members_count === "number"
    ) {
      countElement.textContent =
        data.members_count.toLocaleString();

      countElement.classList.remove("loading");

      statusElement.textContent =
        "Updated from Chess.com PubAPI";
    } else {
      throw new Error("Member count unavailable");
    }

  } catch (error) {
    console.error(error);

    countElement.textContent = "—";
    countElement.classList.remove("loading");

    statusElement.textContent =
      "Chess.com data is temporarily unavailable";
  }
}


/* ---------------- NEWEST MEMBERS ---------------- */

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatJoined(timestamp) {
  if (!timestamp) return "";

  const date = new Date(timestamp * 1000);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString(undefined, {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}


async function updateNewestMembers() {
  const list = document.getElementById("membersList");

  try {
    const data = await jsonp(
      "https://api.chess.com/pub/club/" +
      MIFFY_CLUB +
      "/members"
    );

    const allMembers = [];

    /*
      PubAPI provides weekly/monthly/all_time
      member lists. Combine them so that we have
      the best chance of finding the newest joins.
    */
    const groups = [
      data && data.weekly,
      data && data.monthly,
      data && data.all_time
    ];

    groups.forEach(group => {
      if (!Array.isArray(group)) return;

      group.forEach(member => {
        if (
          member &&
          member.username &&
          typeof member.joined === "number"
        ) {
          allMembers.push(member);
        }
      });
    });

    /*
      Remove duplicate usernames.
    */
    const unique = new Map();

    allMembers.forEach(member => {
      const key = member.username.toLowerCase();

      const previous = unique.get(key);

      if (
        !previous ||
        member.joined > previous.joined
      ) {
        unique.set(key, member);
      }
    });

    const newest = Array.from(unique.values())
      .sort((a, b) => b.joined - a.joined)
      .slice(0, 3);

    if (!newest.length) {
      throw new Error("No member data returned");
    }

    list.innerHTML = "";

    newest.forEach((member, index) => {
      const row = document.createElement("div");
      row.className = "member";

      const number = document.createElement("div");
      number.className = "member-number";
      number.textContent = index + 1;

      const name = document.createElement("div");
      name.className = "member-name";
      name.textContent = member.username;

      const date = document.createElement("div");
      date.className = "member-date";
      date.textContent = formatJoined(member.joined);

      row.appendChild(number);
      row.appendChild(name);
      row.appendChild(date);

      list.appendChild(row);
    });

  } catch (error) {
    console.error(error);

    list.innerHTML = "";

    for (let i = 1; i <= 3; i++) {
      const row = document.createElement("div");
      row.className = "member";

      row.innerHTML =
        '<div class="member-number">' +
        i +
        '</div>' +
        '<div class="member-name error">' +
        'Unavailable' +
        '</div>';

      list.appendChild(row);
    }
  }
}


/* ---------------- CALENDAR ---------------- */

const monthNames = [
  "January",
  "February",
  "March",
  "April",
  "May",
  "June",
  "July",
  "August",
  "September",
  "October",
  "November",
  "December"
];

let calendarDate = new Date();


function renderCalendar() {
  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  document.getElementById("calendarMonth").textContent =
    monthNames[month] + " " + year;

  const container =
    document.getElementById("calendarDays");

  container.innerHTML = "";

  const firstDay =
    new Date(year, month, 1).getDay();

  const daysInMonth =
    new Date(year, month + 1, 0).getDate();

  const today = new Date();

  for (let i = 0; i < firstDay; i++) {
    const empty = document.createElement("div");
    empty.className = "calendar-day empty";
    empty.innerHTML = "<span>0</span>";
    container.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement("div");
    cell.className = "calendar-day";

    const isToday =
      day === today.getDate() &&
      month === today.getMonth() &&
      year === today.getFullYear();

    if (isToday) {
      cell.classList.add("today");
    }

    const span = document.createElement("span");
    span.textContent = day;

    cell.appendChild(span);
    container.appendChild(cell);
  }
}


document.getElementById("prevMonth")
  .addEventListener("click", () => {
    calendarDate.setMonth(
      calendarDate.getMonth() - 1
    );

    renderCalendar();
  });


document.getElementById("nextMonth")
  .addEventListener("click", () => {
    calendarDate.setMonth(
      calendarDate.getMonth() + 1
    );

    renderCalendar();
  });


/* ---------------- LOCAL TIME ---------------- */

const timezoneCountryMap = {
  "Asia/Kolkata": "India",
  "Asia/Calcutta": "India",

  "Asia/Dhaka": "Bangladesh",
  "Asia/Kathmandu": "Nepal",
  "Asia/Karachi": "Pakistan",
  "Asia/Colombo": "Sri Lanka",

  "Asia/Tokyo": "Japan",
  "Asia/Seoul": "South Korea",
  "Asia/Shanghai": "China",
  "Asia/Hong_Kong": "Hong Kong",
  "Asia/Singapore": "Singapore",
  "Asia/Bangkok": "Thailand",
  "Asia/Jakarta": "Indonesia",
  "Asia/Manila": "Philippines",

  "Europe/London": "United Kingdom",
  "Europe/Paris": "France",
  "Europe/Berlin": "Germany",
  "Europe/Rome": "Italy",
  "Europe/Madrid": "Spain",

  "America/New_York": "United States",
  "America/Chicago": "United States",
  "America/Denver": "United States",
  "America/Los_Angeles": "United States",

  "America/Toronto": "Canada",
  "America/Vancouver": "Canada",

  "Australia/Sydney": "Australia",
  "Australia/Melbourne": "Australia",
  "Pacific/Auckland": "New Zealand"
};


function getCountryFromTimezone(timezone) {
  if (timezoneCountryMap[timezone]) {
    return timezoneCountryMap[timezone];
  }

  const parts = timezone.split("/");

  if (parts.length > 1) {
    return parts[0];
  }

  return "Unknown";
}


function getAreaFromTimezone(timezone) {
  const parts = timezone.split("/");

  if (parts.length >= 2) {
    return parts
      .slice(1)
      .join(" / ")
      .replaceAll("_", " ");
  }

  return timezone;
}


function getTimeTheme(hour) {
  if (hour >= 5 && hour < 8) {
    return "morning";
  }

  if (hour >= 8 && hour < 17) {
    return "day";
  }

  if (hour >= 17 && hour < 20) {
    return "sunset";
  }

  return "night";
}


function updateLocalInfo() {
  const now = new Date();

  const timezone =
    Intl.DateTimeFormat().resolvedOptions().timeZone ||
    "Local timezone";

  const hour = Number(
    new Intl.DateTimeFormat(undefined, {
      hour: "numeric",
      hour12: false
    }).format(now)
  );

  document.body.classList.remove(
    "morning",
    "day",
    "sunset",
    "night"
  );

  document.body.classList.add(
    getTimeTheme(hour)
  );

  document.getElementById("localTime").textContent =
    now.toLocaleTimeString(undefined, {
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit"
    });

  document.getElementById("localDate").textContent =
    now.toLocaleDateString(undefined, {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });

  document.getElementById("country").textContent =
    getCountryFromTimezone(timezone);

  document.getElementById("area").textContent =
    getAreaFromTimezone(timezone);

  document.getElementById("timezone").textContent =
    timezone;
}


/* ---------------- START ---------------- */

renderCalendar();
updateLocalInfo();

setInterval(updateLocalInfo, 1000);

/*
  Run requests one after another.
  This avoids sending parallel PubAPI requests.
*/
(async function loadChessData() {
  await updateMemberCount();
  await updateNewestMembers();
})();

/*
  PubAPI responses can be cached by Chess.com
  for up to 12 hours, so repeatedly requesting
  the API does not necessarily mean the displayed
  member count changes immediately.
*/
setInterval(async () => {
  await updateMemberCount();
  await updateNewestMembers();
}, 5 * 60 * 1000);
</script>

</body>
</html>
